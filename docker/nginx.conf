server {
    listen 80;
    # IPv6: add `listen [::]:80;` where the host supports it. Not set by default, because nginx
    # refuses to start on hosts with IPv6 disabled (the image's own IPv6 helper skips custom configs).
    root /usr/share/nginx/html;

    # anti-ai: AI crawlers, assistants, scripts → 403; search engines and link previews → /about/ only.
    include /etc/nginx/snippets/anti-ai-server.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown text/javascript application/javascript application/json application/geo+json application/manifest+json application/x-protobuf image/svg+xml;

    # (A `types` block here would replace the whole MIME map; unknown types are set per location.)
    charset utf-8;
    charset_types text/plain text/markdown application/json application/geo+json;

    # The app shell and the service worker must be revalidated so updates arrive.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # What the server has now; the app compares it with its own build to offer an update.
    location = /version.json {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Bundled areas: manifest and data must always match (checksum), so revalidate every time.
    location /maps/ {
        default_type application/geo+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static data: a missing file is a 404, never the app page (MapLibre would parse HTML as glyphs).
    location /glyphs/ {
        default_type application/x-protobuf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /licenses/ {
        default_type text/markdown;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The public info page: a missing file there is a 404, never the app shell (crawlers read it).
    location /about/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
