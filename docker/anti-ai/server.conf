# Generated by anti-ai (anti-ai/bin/anti-ai.mjs) from the site configuration. Do not edit by hand.
# Include in the server {} block, before its locations.

# A server-level access_log replaces the inherited one, so the normal log is named again.
access_log /var/log/nginx/access.log combined;
access_log /var/log/nginx/anti-ai/anti-ai.log anti_ai if=$anti_ai_logged;

limit_req zone=anti_ai_documents burst=120 nodelay;
limit_req_status 429;

# Server-level answers (before any location) carry the policy headers too.
add_header X-Robots-Tag $anti_ai_robots always;
add_header tdm-reservation 1 always;

error_page 403 @anti_ai_forbidden;
location @anti_ai_forbidden {
    default_type text/plain;
    include /etc/nginx/snippets/anti-ai-headers.conf;
    add_header Cache-Control "no-store" always;
    return 403 "Forbidden: automated access, scraping and use for AI are not permitted.";
}

if ($anti_ai_action = trap) {
    return 403;
}
if ($anti_ai_action = deny) {
    return 403;
}
# Internal redirects (index, try_files) run these again: never rewrite the info page itself.
if ($anti_ai_action = info) {
    rewrite "^(?!/about(/|$))" /about/ last;
}
