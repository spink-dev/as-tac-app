|cohere-ai|DoubaoBot|Kimi-User|LinkupBot|omgilibot|Panscient|QueritBot|Shap-User|TavilyBot|TongyiBot|TwinAgent|aiHitBot|ApifyBot|Applebot|BixelBot|Bravebot|BuddyBot|Cotoyogi|Crawl4AI|ERNIEBot|Grok Bot|Instinct|LinerBot|NagetBot|opencode|Operator|PanguBot|PetalBot|PhindBot|qodercli|QuillBot|Thinkbot|Timpibot|xAI-Grok|YiyanBot|Andibot|Anomura|ChatGPT|Diffbot|ExaUser|GrokBot|HarkBot|HenkBot|Hunyuan|iAskBot|KimiBot|NovaAct|QwenBot|ScryBot|ShapBot|WARDBot|WRTNBot|AI2Bot|Awario|Claude|Cursor|ExaBot|GPTBot|newsai|omgili|OpenAI|Scrapy|Spider|YouBot|CCBot|Codex|Comet|Devin|UseAI|wpbot|YiBot|Code|Muse|nbot|Trae|Dot|LCC|YaK)(?:[^a-z0-9]|$)" ai;
    "~*(?:^|[^a-z0-9])(?:Slackbot-LinkExpanding|SkypeUriPreview|Bluesky Cardyb|Slack-ImgProxy|Pinterestbot|LinkedInBot|TelegramBot|Discordbot|Twitterbot|redditbot|Iframely|Mastodon|WhatsApp|Embedly|vkShare|Signal|Viber)(?:[^a-z0-9]|$)" preview;
    "~*(?:^|[^a-z0-9])(?:DuckDuckGo-Favicons-Bot|Google-InspectionTool|Googlebot-Image|Googlebot-Video|Storebot-Google|Googlebot-News|YandexImages|Baiduspider|BingPreview|DuckDuckBot|Googlebot|MojeekBot|SeznamBot|YandexBot|Qwantbot|bingbot|msnbot|Slurp|Yeti)(?:[^a-z0-9]|$)" search;
    "~*(?:^|[^a-z0-9])(?:Apache-HttpClient|Offline Explorer|archive[.]org_bot|python-requests|Go-http-client|HeadlessChrome|PostmanRuntime|python-urllib|python-httpx|Teleport Pro|ia_archiver|libwww-perl|LWP[:][:]Simple|MSIECrawler|GuzzleHttp|node-fetch|Playwright|SiteSucker|PhantomJS|Puppeteer|WebCopier|webdriver|Electron|Headless|Heritrix|insomnia|Selenium|aiohttp|Faraday|HTTrack|masscan|Nuclei|okhttp|Scrapy|sqlmap|undici|WebZIP|axios|colly|httpx|nikto|Nutch|zgrab|curl|Deno|Java|Nmap|node|Ruby|Wget|Bun|got|PHP)(?:[^a-z0-9]|$)" tool;
    "~*(?:bot|crawler|spider|scraper|fetcher|crawl)/[0-9]|compatible;[^)]*(?:bot|crawler|spider|scraper)" bot;
    "~^[ 	]*$" bot;
}

# Signed AI agents (Web Bot Auth, e.g. ChatGPT agent) are AI whatever their user agent says.
map $http_signature_agent $anti_ai_sig_agent {
    default 1;
    "" 0;
}
map $http_signature_input $anti_ai_sig_input {
    default 0;
    "~*web-bot-auth" 1;
}
map "$anti_ai_sig_agent$anti_ai_sig_input:$anti_ai_ua" $anti_ai_kind {
    default ai;
    "~^00:([a-z]+)$" $1;
}

# Which path ($uri: decoded and normalised).
map $uri $anti_ai_path {
    default asset;
    "/robots.txt" public;
    "/ai.txt" public;
    "/.well-known/tdmrep.json" public;
    "/icon.svg" info-asset;
    "/icon-192.png" info-asset;
    "/icon-512.png" info-asset;
    "~^/_/t9q4x2(/|$)" trap;
    "~^/about(/|$)" info;
    "~*[.]html$" html;
    "~/[^/.]*$" html;
}

map $http_accept_language $anti_ai_lang {
    default 1;
    "" 0;
}

# The decision table, generated from decideKinds() for every combination.
map "$anti_ai_kind:$anti_ai_path:$anti_ai_lang" $anti_ai_action {
    default deny;
    allow:trap:0 trap;
    allow:trap:1 trap;
    allow:public:0 allow;
    allow:public:1 allow;
    allow:info:0 allow;
    allow:info:1 allow;
    allow:info-asset:0 allow;
    allow:info-asset:1 allow;
    allow:html:0 allow;
    allow:html:1 allow;
    allow:asset:0 allow;
    allow:asset:1 allow;
    browser:trap:0 trap;
    browser:trap:1 trap;
    browser:public:0 allow;
    browser:public:1 allow;
    browser:info:0 allow;
    browser:info:1 allow;
    browser:info-asset:0 allow;
    browser:info-asset:1 allow;
