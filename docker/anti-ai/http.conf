# Generated by anti-ai (anti-ai/bin/anti-ai.mjs) from the site configuration. Do not edit by hand.
# Include once in the http context (conf.d/*.conf files are included there).

set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Which client: the first list that matches decides (as in classify.mjs).
