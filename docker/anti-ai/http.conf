    browser:html:1 allow;
    browser:asset:0 allow;
    browser:asset:1 allow;
    preview:trap:0 trap;
    preview:trap:1 trap;
    preview:public:0 allow;
    preview:public:1 allow;
    preview:info:0 allow;
    preview:info:1 allow;
    preview:info-asset:0 allow;
    preview:info-asset:1 allow;
    preview:html:0 info;
    preview:html:1 info;
    preview:asset:0 deny;
    preview:asset:1 deny;
    search:trap:0 trap;
    search:trap:1 trap;
    search:public:0 allow;
    search:public:1 allow;
    search:info:0 allow;
    search:info:1 allow;
    search:info-asset:0 allow;
    search:info-asset:1 allow;
    search:html:0 deny;
    search:html:1 deny;
    search:asset:0 deny;
    search:asset:1 deny;
    ai:trap:0 trap;
    ai:trap:1 trap;
    ai:public:0 allow;
    ai:public:1 allow;
    ai:info:0 deny;
    ai:info:1 deny;
    ai:info-asset:0 deny;
    ai:info-asset:1 deny;
    ai:html:0 deny;
    ai:html:1 deny;
    ai:asset:0 deny;
    ai:asset:1 deny;
    tool:trap:0 trap;
    tool:trap:1 trap;
    tool:public:0 allow;
    tool:public:1 allow;
    tool:info:0 deny;
    tool:info:1 deny;
    tool:info-asset:0 deny;
    tool:info-asset:1 deny;
    tool:html:0 deny;
    tool:html:1 deny;
    tool:asset:0 deny;
    tool:asset:1 deny;
    bot:trap:0 trap;
    bot:trap:1 trap;
    bot:public:0 allow;
    bot:public:1 allow;
    bot:info:0 deny;
    bot:info:1 deny;
    bot:info-asset:0 deny;
    bot:info-asset:1 deny;
    bot:html:0 deny;
    bot:html:1 deny;
    bot:asset:0 deny;
    bot:asset:1 deny;
}

map $anti_ai_path $anti_ai_robots {
    default "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai";
    info "noarchive, noai, noimageai";
    info-asset "noarchive, noai, noimageai";
}

# Documents only are rate-limited (an empty key is not limited).
map $anti_ai_path $anti_ai_document_key {
    default "";
    html $binary_remote_addr;
}
limit_req_zone $anti_ai_document_key zone=anti_ai_documents:10m rate=10r/s;

map $anti_ai_action $anti_ai_logged {
    default 1;
    allow 0;
}
log_format anti_ai '$remote_addr [$time_local] "$request" $status action=$anti_ai_action kind=$anti_ai_kind path=$anti_ai_path ua="$http_user_agent"';
