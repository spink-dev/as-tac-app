# Included in every location: nginx drops server-level add_header in any location with its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Nominatim's usage policy expects a referrer; send only the origin to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Own position (field mode) and the compass sensors are used by the app itself only.
add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=(), payment=(), usb=()" always;
# anti-ai: X-Robots-Tag (only /about/ may be listed) and the text-and-data-mining reservation.
include /etc/nginx/snippets/anti-ai-headers.conf;
